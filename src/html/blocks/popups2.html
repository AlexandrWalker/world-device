<div id="popup-tradein" class="popup">
  <div class="popup__wrap" data-lenis-prevent>
    <div class="popup__content">
      <div class="popup__head">
        <div class="popup__head-title">
          Вы хотите создать заявку в разделе Trade-in?
        </div>
      </div>
      <div class="popup__buttons">
        <button class="btn btn--blue">
          Отправить заявку
        </button>
        <button class="btn btn--white">
          Отменить
        </button>
      </div>
    </div>
  </div>
</div>

<div id="popup-addadres" class="popup">
  <div class="popup__wrap" data-lenis-prevent>
    <div class="popup__content">
      <div class="popup__head">
        <div class="popup__head-title">
          Добавить адрес
        </div>
      </div>
      <form class="form addadres-form">
        <input type="text" name="username" placeholder="Город">
        <input type="text" name="username" placeholder="Улица">
        <input type="text" name="username" placeholder="Дом">
        <div class="popup__buttons">
          <button class="btn btn--blue">
            Добавить
          </button>
          <div class="addadres-priority">
            <label class="addadres-toggle">
              <input type="checkbox">
              <span class="addadres-toggle__slider">
              </span>
            </label>
            <span>Сделать приоритетным</span>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="popup-changenumber" class="popup">
  <div class="popup__wrap" data-lenis-prevent>
    <div class="popup__content">
      <div class="popup__head">
        <div class="popup__head-title">
          Ваш номер успешно изменен!
        </div>
      </div>
      <div class="popup__buttons">
        <button class="btn btn--blue">
          <a href="/cabinet.html">
            Вернуться в личный кабинет
          </a>
        </button>
      </div>
    </div>
  </div>
</div>
